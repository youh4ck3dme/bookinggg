name: CI Gate

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm -r lint

      - name: Unit tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: E2E /admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: pnpm -C apps/web test:e2e
